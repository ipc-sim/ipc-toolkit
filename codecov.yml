coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 75%
        threshold: 5%
        only_pulls: true
ignore:
  # "**" so this reaches the whole tree: a single "*" does not cross a "/", so
  # "tests/*" only ever matched files sitting directly in tests/, leaving
  # everything under tests/src/tests/ reported.
  - "tests/**"
