[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "ipctk"
version = "2.0.0a0"
authors = [{ name = "Zachary Ferguson", email = "zy.fergus@gmail.com" }]
description = "A set of reusable functions to integrate Incremental Potential Contact (IPC) into a simulation."
readme = "docs/PYPI_README.md"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]
requires-python = ">=3.8"
dependencies = ["numpy", "scipy"]
keywords = ["IPC", "simulation", "physics", "science", "research"]

[project.optional-dependencies]
# Extra packages for the interactive demos in ipctk.demo
demo = ["polyscope", "meshio"]

[project.scripts]
ipctk-rigid = "ipctk.demo.rigid:main"

[project.urls]
"Homepage" = "https://ipctk.xyz"
"Bug Tracker" = "https://github.com/ipc-sim/ipc-toolkit/issues"
"Source Code" = "https://github.com/ipc-sim/ipc-toolkit"

[tool.scikit-build]
minimum-version = "build-system.requires"
# scikit-build-core downloads CMake and Ninja from PyPI only when the system
# doesn't already have suitable versions.
cmake.version = ">=3.24"
# Override with SKBUILD_CMAKE_BUILD_TYPE=Debug (or -Ccmake.build-type=Debug).
cmake.build-type = "Release"
# We keep the build folder at a stable, per-wheel path instead of a temporary
# one, so rebuilds are incremental and ccache sees the same paths every time.
build-dir = "build/{wheel_tag}"
# We build only the extension. Building ALL would also build extras like
# oneTBB's tbbmalloc that the module never links.
build.targets = ["ipctk"]
# The pure-Python ipctk package, which wraps the compiled ipctk._ipctk
wheel.packages = ["python/ipctk"]
# Third-party dependencies (oneTBB, spdlog, ...) register their own install
# rules. We install only our "python" component, so their headers and static
# libraries stay out of the wheel.
install.components = ["python"]
# The SDist holds the git-tracked files minus these. Developer-only folders
# stay out; the PyPI README stays in because the metadata needs it.
sdist.exclude = [".github/", "docs/", "notebooks/", "tests/"]
sdist.include = ["docs/PYPI_README.md"]

[tool.scikit-build.cmake.define]
IPC_TOOLKIT_BUILD_TESTS = "OFF"
IPC_TOOLKIT_BUILD_PYTHON = "ON"
# The demo simulator (ipctk.demo) and glTF I/O back the bundled demos, e.g.,
# `python -m ipctk.demo.rigid scene.glb`.
IPC_TOOLKIT_BUILD_DEMO = "ON"
IPC_TOOLKIT_WITH_GLTF = "ON"
# Set IPCTK_WITH_SIMD=0 (or off/false/no) to build without SIMD.
IPC_TOOLKIT_WITH_SIMD = { env = "IPCTK_WITH_SIMD", default = "ON" }

[tool.cibuildwheel]
build-frontend = "build"
