name: Python

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/python.yml'
      - 'cmake/**'
      - 'python/src/**'
      - 'python/src/CMakeLists.txt'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'MANIFEST.in'
      - 'pyproject.toml'
      - 'setup.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  Build:
    name: ${{ matrix.name }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.14"]') || fromJSON('["3.10", "3.11", "3.12", "3.13", "3.14"]') }}
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macOS-latest
            name: macOS
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Ccache (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install ccache
          echo 'CACHE_PATH=~/.cache/ccache' >> "$GITHUB_ENV"

      - name: Install Ccache (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ccache
          echo 'CACHE_PATH=~/Library/Caches/ccache' >> "$GITHUB_ENV"

      - name: Install Ccache (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ccache
          "CACHE_PATH=${env:LOCALAPPDATA}\ccache" | Out-File -FilePath $env:GITHUB_ENV -Append

      # FindSIMD compiles with -march=native, which bakes the building runner's
      # ISA into every cached object file, but ccache hashes the flag string and
      # not the CPU it expands to. Without a CPU component in the cache key,
      # objects built on one runner model get restored onto another, and a
      # translation unit compiled fresh on the new CPU then disagrees with the
      # cached ones about xsimd::default_arch. Key the cache on the CPU so it
      # only restores onto matching hardware.
      - name: CPU fingerprint (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            CPU=$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2-)
            KEY=$(printf '%s' "$CPU" | sha256sum | cut -c1-12)
          else
            CPU=$(sysctl -n machdep.cpu.brand_string)
            KEY=$(printf '%s' "$CPU" | shasum -a 256 | cut -c1-12)
          fi
          echo "CPU: $CPU"
          echo "CPU_KEY=$KEY" >> "$GITHUB_ENV"

      - name: CPU fingerprint (Windows)
        if: runner.os == 'Windows'
        run: |
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1 -ExpandProperty Name
          Write-Host "CPU: $cpu"
          $stream = [IO.MemoryStream]::new([Text.Encoding]::UTF8.GetBytes($cpu))
          $key = (Get-FileHash -InputStream $stream -Algorithm SHA256).Hash.Substring(0, 12)
          "CPU_KEY=$key" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache Build
        id: cache-build
        uses: actions/cache@v5
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ runner.os }}-Python${{ matrix.python-version }}-${{ env.CPU_KEY }}-cache

      - name: Prepare Ccache
        run: |
          ccache --max-size=1.0G
          ccache -V && ccache --show-config
          ccache --show-stats && ccache --zero-stats

      - name: Build and Install
        env:
          IPCTK_WITH_SIMD: ${{ runner.os == 'Linux' && '0' || '1' }}
        run: |
          pip install --verbose . && ccache --show-stats

      - name: Tests
        run: |
          pip install -r python/tests/requirements.txt
          nose2 -v --pretty-assert -s python/tests
