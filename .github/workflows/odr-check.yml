name: ODR Check

# Link the unit tests with LTO and -Wodr. GCC then compares every type and
# function across all object files, including the dependencies built through
# CPM, and warns when two of them disagree. We use it to catch an Eigen ABI
# mismatch, where a dependency is compiled with different Eigen alignment
# settings than the IPC Toolkit. That mismatch corrupts memory only for some
# combinations of inlining and link order, so the regular tests can pass with it.
# This check catches it every time.

on:
  # We also run on main so that it saves a ccache that new PRs can restore.
  # GitHub only lets a PR read caches from its own branch and its base branch.
  push:
    branches: [main]
    paths:
      - '.github/workflows/odr-check.yml'
      - 'cmake/**'
      - 'CMakeLists.txt'
  pull_request:
    paths:
      - '.github/workflows/odr-check.yml'
      - 'cmake/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  odr:
    name: LTO ODR Check
    runs-on: ubuntu-latest
    # actions: write lets the prune step delete older ccaches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Dependencies
        run: sudo apt-get install ccache

      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v2
        id: cpu-cores

      # We build with the same SIMD flags as the Linux jobs in continuous.yml,
      # since they decide Eigen's alignment in the IPC Toolkit's own code.
      - name: Check x86-64-v3 support
        run: |
          for f in avx2 bmi1 bmi2 f16c fma abm movbe xsave; do
            grep -qw "$f" /proc/cpuinfo || { echo "::error::Runner CPU lacks $f, which x86-64-v3 requires"; exit 1; }
          done

      # ccache only skips compiling. GCC still runs the LTO link, where -Wodr
      # does its cross-object comparison, so cache hits don't hide violations.
      # We give each run its own key and restore the newest one by prefix,
      # because a fixed key is saved once and never updated.
      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-odr-ccache-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-odr-ccache-

      - name: Prepare ccache
        run: |
          ccache --max-size=1.0G
          ccache --zero-stats

      - name: Configure
        run: |
          cmake -S . -B build \
            -DIPC_TOOLKIT_BUILD_TESTS=ON \
            -DSIMD_CXX_FLAGS=-march=x86-64-v3 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            "-DCMAKE_CXX_FLAGS=-Wodr" \
            "-DCMAKE_EXE_LINKER_FLAGS=-Wodr -flto=auto"

      - name: Build and link with LTO
        run: |
          set -o pipefail
          cmake --build build -j ${{ steps.cpu-cores.outputs.count }} --target ipc_toolkit_tests 2>&1 | tee build.log
          ccache --show-stats

      # We save the cache even when the check fails, so the next push to the PR
      # starts from it.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-odr-ccache-${{ github.run_id }}

      - name: Prune old ccaches
        if: always()
        continue-on-error: true
        uses: ./.github/actions/prune-ccache
        with:
          prefix: ${{ runner.os }}-odr-ccache-

      - name: Check for ODR violations
        run: |
          if grep -q "violates the C++ One Definition Rule" build.log; then
            # Turn each warning into an annotation on the offending line.
            grep -E "^[^ ]+:[0-9]+:[0-9]+: warning: .*violates the C\+\+ One Definition Rule" build.log \
              | sed -E "s|^$PWD/||; s|^([^:]+):([0-9]+):[0-9]+: warning: (.*)$|::error file=\1,line=\2::\3|" \
              | sort -u
            echo "::error::Found ODR violations. A common cause is a dependency compiled with different Eigen alignment settings; see cmake/ipc_toolkit/ipc_toolkit_eigen_abi.cmake."
            grep -B2 -A10 "violates the C++ One Definition Rule" build.log
            exit 1
          fi
          echo "No ODR violations found."
