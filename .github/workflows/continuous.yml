name: Build

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/continuous.yml'
      - 'cmake/**'
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CTEST_OUTPUT_ON_FAILURE: ON
  CTEST_PARALLEL_LEVEL: 2

jobs:
  Build:
    name: ${{ matrix.name }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config: [Debug, Release]
        include:
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install ccache
          echo 'CACHE_PATH=~/.cache/ccache' >> "$GITHUB_ENV"

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ccache
          echo 'CACHE_PATH=~/Library/Caches/ccache' >> "$GITHUB_ENV"

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ccache
          "CACHE_PATH=${env:LOCALAPPDATA}\ccache" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v2
        id: cpu-cores

      # On Linux, explicitly build for x86-64-v3 instead of -march=native. This
      # avoids issues with ccache restoring from a runner with a different ISA.
      - name: Check x86-64-v3 support (Linux)
        if: runner.os == 'Linux'
        run: |
          for f in avx2 bmi1 bmi2 f16c fma abm movbe xsave; do
            grep -qw "$f" /proc/cpuinfo || { echo "::error::Runner CPU lacks $f, which x86-64-v3 requires"; exit 1; }
          done
          echo "CPU: $(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2-)"
          echo "SIMD_ARGS=-DSIMD_CXX_FLAGS=-march=x86-64-v3" >> "$GITHUB_ENV"

      # Cache entries are immutable, so a fixed key is saved once and never
      # updated. We give each run its own key and restore the newest one by
      # prefix instead. Only pushes to main save (see "Save ccache" below), and
      # PRs restore from those.
      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ runner.os }}-${{ matrix.config }}-ccache-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-${{ matrix.config }}-ccache-

      - name: Prepare ccache
        run: |
          ccache --max-size=1.0G
          ccache -V && ccache --show-config
          ccache --show-stats && ccache --zero-stats

      # Debug keeps the asserts (NDEBUG stays undefined) but drops -g and builds
      # at -O1. Debug info made the Debug ccache about 20x larger than Release,
      # and CI never reads it: assert and Catch2 messages carry __FILE__ and
      # __LINE__. At -O0 none of Eigen's small template functions get inlined,
      # which made the Debug tests about 10x slower than Release. -O1 lets the
      # compiler inline most of them, and every assert is still checked.
      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DIPC_TOOLKIT_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS_DEBUG=-O1 \
            -DCMAKE_CXX_FLAGS_DEBUG=-O1 \
            $SIMD_ARGS \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      # MSVC's default Debug flags include /Zi, which writes debug info to a
      # shared PDB that ccache cannot cache, so we drop it the same way the
      # Linux/macOS configure drops -g.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cmake -G Ninja ^
            -DIPC_TOOLKIT_BUILD_TESTS=ON ^
            -DCMAKE_C_FLAGS_DEBUG="/Od /Ob0 /RTC1" ^
            -DCMAKE_CXX_FLAGS_DEBUG="/Od /Ob0 /RTC1" ^
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} ^
            -B build ^
            -S .

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake --build build -j ${{ steps.cpu-cores.outputs.count }}
          ccache --show-stats

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cmake --build build -j ${{ steps.cpu-cores.outputs.count }} && ccache --show-stats

      # We save after a failed build too, so the next run reuses what did
      # compile.
      - name: Save ccache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ runner.os }}-${{ matrix.config }}-ccache-${{ github.run_id }}

      - name: Tests
        run: cd build; ctest --verbose -j ${{ steps.cpu-cores.outputs.count }}
