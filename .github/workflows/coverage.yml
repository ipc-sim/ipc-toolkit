name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/coverage.yml'
      - 'cmake/**'
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'codecov.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  Coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Dependencies
        run: |
          sudo apt-get install ccache lcov
          echo 'CACHE_PATH=~/.cache/ccache' >> "$GITHUB_ENV"

      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v2
        id: cpu-cores

      # FindSIMD and Tight-Inclusion both compile with -march=native, which
      # bakes the building runner's ISA into every cached object file. ccache
      # hashes the literal flag string, not what it expands to, so restored
      # objects are only safe on a runner with the same ISA.
      # The CPU model name has not been enough to guarantee that: EPYC 9V74
      # runners restored each other's objects and crashed with SIGILL. We also
      # hash the flags the compiler expands -march=native to, which is exactly
      # what ends up in the object files. We keep the model name in the hash too,
      # so the key is never weaker than before.
      - name: CPU fingerprint
        run: |
          CPU=$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2-)
          ISA=$(echo | c++ -march=native -E -v - 2>&1 | grep -oE -- ' -m[a-z0-9=._+-]+' | sort -u | tr -d '\n')
          echo "CPU: $CPU"
          echo "ISA:$ISA"
          echo "CPU_KEY=$(printf '%s\n%s' "$CPU" "$ISA" | sha256sum | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Cache Build
        id: cache-build
        uses: actions/cache@v5
        with:
          path: ${{ env.CACHE_PATH }}
          key: coverage-${{ env.CPU_KEY }}-cache

      - name: Prepare ccache
        run: |
          ccache --max-size=1.0G
          ccache -V && ccache --show-config
          ccache --show-stats && ccache --zero-stats\

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DIPC_TOOLKIT_BUILD_TESTS=ON \
            -DIPC_TOOLKIT_WITH_CODE_COVERAGE=ON \
            -DCMAKE_BUILD_TYPE=Release \

      - name: Build
        run: |
          cmake --build build -j ${{ steps.cpu-cores.outputs.count }}
          ccache --show-stats

      - name: Run Coverage
        run: |
          cd build
          ctest --verbose -j ${{ steps.cpu-cores.outputs.count }}
          lcov --directory . --capture --output-file coverage.info --ignore-errors inconsistent,format,gcov,mismatch
          lcov --remove coverage.info --ignore-errors unused '/usr/*' "$HOME/.cache/*" "*tests/*" --output-file coverage.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: build/coverage.info
          flags: unittests
          name: ipc-toolkit
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
