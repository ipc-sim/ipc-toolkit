name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/coverage.yml'
      - 'cmake/**'
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'codecov.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  Coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # actions: write lets the prune step delete older ccaches.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Dependencies
        run: |
          sudo apt-get install ccache lcov
          echo 'CACHE_PATH=~/.cache/ccache' >> "$GITHUB_ENV"

      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v2
        id: cpu-cores

      # On Linux, explicitly build for x86-64-v3 instead of -march=native. This
      # avoids issues with ccache restoring from a runner with a different ISA.
      - name: Check x86-64-v3 support
        run: |
          for f in avx2 bmi1 bmi2 f16c fma abm movbe xsave; do
            grep -qw "$f" /proc/cpuinfo || { echo "::error::Runner CPU lacks $f, which x86-64-v3 requires"; exit 1; }
          done
          echo "CPU: $(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2-)"

      # Cache entries are immutable, so a fixed key is saved once and never
      # updated. We give each run its own key and restore the newest one by
      # prefix instead. Only pushes to main save, and PRs restore from those.
      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CACHE_PATH }}
          key: coverage-ccache-${{ github.run_id }}
          restore-keys: coverage-ccache-

      - name: Prepare ccache
        run: |
          ccache --max-size=1.0G
          ccache -V && ccache --show-config
          ccache --show-stats && ccache --zero-stats

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DIPC_TOOLKIT_BUILD_TESTS=ON \
            -DIPC_TOOLKIT_WITH_CODE_COVERAGE=ON \
            -DSIMD_CXX_FLAGS=-march=x86-64-v3 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build -j ${{ steps.cpu-cores.outputs.count }}
          ccache --show-stats

      - name: Save ccache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CACHE_PATH }}
          key: coverage-ccache-${{ github.run_id }}

      - name: Prune old ccaches
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./.github/actions/prune-ccache
        with:
          prefix: coverage-ccache-

      - name: Run Coverage
        run: |
          cd build
          ctest --verbose -j ${{ steps.cpu-cores.outputs.count }}
          lcov --directory . --capture --output-file coverage.info --ignore-errors inconsistent,format,gcov,mismatch
          lcov --remove coverage.info --ignore-errors unused,inconsistent '/usr/*' "$HOME/.cache/*" "*tests/*" --output-file coverage.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: build/coverage.info
          flags: unittests
          name: ipc-toolkit
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
