name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/coverage.yml'
      - 'cmake/**'
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'codecov.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  Coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Dependencies
        run: |
          sudo apt-get install ccache lcov
          echo 'CACHE_PATH=~/.cache/ccache' >> "$GITHUB_ENV"

      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v2
        id: cpu-cores

      # We build for x86-64-v3 (AVX2, FMA, BMI1/2, LZCNT, F16C) instead of
      # -march=native. ccache hashes the literal flag string, not what
      # -march=native expands to, so native objects are only safe on a runner
      # with the same ISA, and EPYC 9V74 runners that restored each other's
      # objects crashed with SIGILL. An explicit baseline makes the flag string
      # describe the generated code, so one cache works on every runner CPU.
      # Tight-Inclusion still adds -march=native for its own objects, but it
      # also passes -mno-avx512f, which caps them at AVX2.
      - name: Check x86-64-v3 support
        run: |
          for f in avx2 bmi1 bmi2 f16c fma abm movbe xsave; do
            grep -qw "$f" /proc/cpuinfo || { echo "::error::Runner CPU lacks $f, which x86-64-v3 requires"; exit 1; }
          done
          echo "CPU: $(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2-)"

      - name: Cache Build
        id: cache-build
        uses: actions/cache@v5
        with:
          path: ${{ env.CACHE_PATH }}
          key: coverage-cache

      - name: Prepare ccache
        run: |
          ccache --max-size=1.0G
          ccache -V && ccache --show-config
          ccache --show-stats && ccache --zero-stats

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DIPC_TOOLKIT_BUILD_TESTS=ON \
            -DIPC_TOOLKIT_WITH_CODE_COVERAGE=ON \
            -DSIMD_CXX_FLAGS=-march=x86-64-v3 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build -j ${{ steps.cpu-cores.outputs.count }}
          ccache --show-stats

      - name: Run Coverage
        run: |
          cd build
          ctest --verbose -j ${{ steps.cpu-cores.outputs.count }}
          lcov --directory . --capture --output-file coverage.info --ignore-errors inconsistent,format,gcov,mismatch
          lcov --remove coverage.info --ignore-errors unused '/usr/*' "$HOME/.cache/*" "*tests/*" --output-file coverage.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: build/coverage.info
          flags: unittests
          name: ipc-toolkit
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
