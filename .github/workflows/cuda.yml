name: CUDA

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/cuda.yml'
      - 'cmake/**'
      - 'src/**'
      - 'tests/**'
      - 'python/**'
      - 'CMakeLists.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CTEST_OUTPUT_ON_FAILURE: ON
  CTEST_PARALLEL_LEVEL: 2

jobs:
  Build:
    name: ${{ matrix.name }} CUDA (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        config:
          - Debug
          # - Release # cannot run multiple cuda-toolkit jobs in parallel
        include:
          - os: ubuntu-latest
            name: Linux
            cuda_subpackages: '["nvcc"]'
          - os: windows-latest
            name: Windows
            # Windows splits the toolkit into finer components than Linux and an
            # invalid component name aborts the whole install, so name exactly
            # what the build needs (per the Windows installer subpackage list):
            #   nvcc   - compiler front-end (nvcc, cudafe++, ptxas, nvlink)
            #   nvvm   - device compiler backend (cicc); nvcc alone omits it
            #   cudart - cuda_runtime.h + runtime library
            #   crt    - crt/host_config.h
            #   thrust - Thrust, and the CUB/libcudacxx headers it bundles
            # ("cccl"/"cub" are not valid Windows installer subpackage names.)
            cuda_subpackages: '["nvcc", "nvvm", "cudart", "crt", "thrust"]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install ccache
          echo 'CACHE_PATH=~/.cache/ccache' >> "$GITHUB_ENV"

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ccache
          "CACHE_PATH=${env:LOCALAPPDATA}\ccache" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Install CUDA before msvc-dev-cmd so the toolkit's bin dir lands on PATH
      # before msvc-dev-cmd snapshots PATH into GITHUB_ENV for later steps.
      # (check_language(CUDA) still does not reliably autodetect nvcc on this
      # runner even with it on PATH, so the Windows configure also passes
      # -DCMAKE_CUDA_COMPILER explicitly.)
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: '13.2.0'
          sub-packages: ${{ matrix.cuda_subpackages }}
          method: 'network'

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v2
        id: cpu-cores

      # On Linux, explicitly build for x86-64-v3 instead of -march=native. This
      # avoids issues with ccache restoring from a runner with a different ISA.
      - name: Check x86-64-v3 support
        if: runner.os == 'Linux'
        run: |
          for f in avx2 bmi1 bmi2 f16c fma abm movbe xsave; do
            grep -qw "$f" /proc/cpuinfo || { echo "::error::Runner CPU lacks $f, which x86-64-v3 requires"; exit 1; }
          done
          echo "CPU: $(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2-)"

      # The CUDA key gets its own prefix because continuous.yml uses the same
      # <os>-<config> names, and cache entries are immutable. Whichever workflow
      # saved first would otherwise own the entry for both builds.
      - name: Cache Build
        id: cache-build
        uses: actions/cache@v5
        with:
          path: ${{ env.CACHE_PATH }}
          key: cuda-${{ runner.os }}-${{ matrix.config }}-cache

      - name: Prepare ccache
        shell: bash
        run: |
          ccache --max-size=1.0G
          ccache -V && ccache --show-config
          ccache --show-stats && ccache --zero-stats

      # Debug keeps the asserts (NDEBUG stays undefined) and -O0 but drops -g.
      # Debug info made the Debug ccache about 20x larger than Release, and CI
      # never reads it: assert and Catch2 messages carry __FILE__ and __LINE__.
      # The CUDA Debug flags are emptied instead of set to -O0, which nvcc would
      # also apply to the device code.
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DIPC_TOOLKIT_WITH_CUDA=ON \
            -DSIMD_CXX_FLAGS=-march=x86-64-v3 \
            -DCMAKE_C_FLAGS_DEBUG=-O0 \
            -DCMAKE_CXX_FLAGS_DEBUG=-O0 \
            -DCMAKE_CUDA_FLAGS_DEBUG= \
            -DCMAKE_CUDA_ARCHITECTURES=75 \
            -DSCALABLE_CCD_CUDA_ARCHITECTURES=75 \
            -DIPC_TOOLKIT_BUILD_TESTS=ON \
            -DIPC_TOOLKIT_BUILD_PYTHON=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      # MSVC's default Debug flags include /Zi, which ccache cannot cache, so we
      # drop it the same way the Linux configure drops -g.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cmake -G Ninja ^
            -DIPC_TOOLKIT_WITH_CUDA=ON ^
            -DCMAKE_C_FLAGS_DEBUG="/Od /Ob0 /RTC1" ^
            -DCMAKE_CXX_FLAGS_DEBUG="/Od /Ob0 /RTC1" ^
            -DCMAKE_CUDA_FLAGS_DEBUG= ^
            -DCMAKE_CUDA_ARCHITECTURES=75 ^
            -DSCALABLE_CCD_CUDA_ARCHITECTURES=75 ^
            -DIPC_TOOLKIT_BUILD_TESTS=ON ^
            -DIPC_TOOLKIT_BUILD_PYTHON=ON ^
            -DCMAKE_CUDA_COMPILER="%CUDA_PATH%\bin\nvcc.exe" ^
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} ^
            -B build ^
            -S .

      # Use bash on every runner. Windows' default pwsh reports only the last
      # native command's exit code, so a failed build followed by a successful
      # `ccache --show-stats` would pass the step.
      - name: Build
        shell: bash
        run: |
          cmake --build build -j ${{ steps.cpu-cores.outputs.count }}
          ccache --show-stats
