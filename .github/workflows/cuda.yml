name: CUDA

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/cuda.yml'
      - 'cmake/**'
      - 'src/**'
      - 'tests/**'
      - 'python/**'
      - 'CMakeLists.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CTEST_OUTPUT_ON_FAILURE: ON
  CTEST_PARALLEL_LEVEL: 2

jobs:
  Build:
    name: CUDA (${{ matrix.config }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - Debug
          - Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Dependencies
        run: |
          sudo apt-get install ccache
          echo 'CACHE_PATH=~/.cache/ccache' >> "$GITHUB_ENV"

      - name: cuda-toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          sub-packages: '["nvcc"]'
          method: 'network'

      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v2
        id: cpu-cores

      # FindSIMD and Tight-Inclusion both compile with -march=native, which
      # bakes the building runner's ISA into every cached object file. ccache
      # hashes the literal flag string, not what it expands to, so restored
      # objects are only safe on a runner with the same ISA.
      # The CPU model name has not been enough to guarantee that: EPYC 9V74
      # runners restored each other's objects and crashed with SIGILL. We also
      # hash the flags the compiler expands -march=native to, which is exactly
      # what ends up in the object files. We keep the model name in the hash too,
      # so the key is never weaker than before.
      - name: CPU fingerprint
        run: |
          CPU=$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2-)
          ISA=$(echo | c++ -march=native -E -v - 2>&1 | grep -oE -- ' -m[a-z0-9=._+-]+' | sort -u | tr -d '\n')
          echo "CPU: $CPU"
          echo "ISA:$ISA"
          echo "CPU_KEY=$(printf '%s\n%s' "$CPU" "$ISA" | sha256sum | cut -c1-12)" >> "$GITHUB_ENV"

      # The CUDA key gets its own prefix because continuous.yml uses the same
      # <os>-<config>-<cpu> names, and cache entries are immutable. Whichever
      # workflow saved first would otherwise own the entry for both builds.
      - name: Cache Build
        id: cache-build
        uses: actions/cache@v5
        with:
          path: ${{ env.CACHE_PATH }}
          key: cuda-${{ runner.os }}-${{ matrix.config }}-${{ env.CPU_KEY }}-cache

      - name: Prepare ccache
        run: |
          ccache --max-size=1.0G
          ccache -V && ccache --show-config
          ccache --show-stats && ccache --zero-stats

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DIPC_TOOLKIT_WITH_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=75 \
            -DSCALABLE_CCD_CUDA_ARCHITECTURES=75 \
            -DIPC_TOOLKIT_BUILD_TESTS=ON \
            -DIPC_TOOLKIT_BUILD_PYTHON=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: |
          cmake --build build -j ${{ steps.cpu-cores.outputs.count }}
          ccache --show-stats
