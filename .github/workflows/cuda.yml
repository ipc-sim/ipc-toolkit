name: CUDA

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/cuda.yml'
      - 'cmake/**'
      - 'src/**'
      - 'tests/**'
      - 'python/**'
      - 'CMakeLists.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CTEST_OUTPUT_ON_FAILURE: ON
  CTEST_PARALLEL_LEVEL: 2

jobs:
  Build:
    name: CUDA (${{ matrix.config }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - Debug
          - Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Dependencies
        run: |
          sudo apt-get install ccache
          echo 'CACHE_PATH=~/.cache/ccache' >> "$GITHUB_ENV"

      - name: cuda-toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          sub-packages: '["nvcc"]'
          method: 'network'

      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v2
        id: cpu-cores

      # We build for x86-64-v3 (AVX2, FMA, BMI1/2, LZCNT, F16C) instead of
      # -march=native. ccache hashes the literal flag string, not what
      # -march=native expands to, so native objects are only safe on a runner
      # with the same ISA, and EPYC 9V74 runners that restored each other's
      # objects crashed with SIGILL. An explicit baseline makes the flag string
      # describe the generated code, so one cache works on every runner CPU.
      # Tight-Inclusion still adds -march=native for its own objects, but it
      # also passes -mno-avx512f, which caps them at AVX2. coverage.yml keeps
      # -march=native so CI still compiles the code users get by default.
      - name: Check x86-64-v3 support
        run: |
          for f in avx2 bmi1 bmi2 f16c fma abm movbe xsave; do
            grep -qw "$f" /proc/cpuinfo || { echo "::error::Runner CPU lacks $f, which x86-64-v3 requires"; exit 1; }
          done
          echo "CPU: $(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2-)"

      # The CUDA key gets its own prefix because continuous.yml uses the same
      # <os>-<config> names, and cache entries are immutable. Whichever workflow
      # saved first would otherwise own the entry for both builds.
      - name: Cache Build
        id: cache-build
        uses: actions/cache@v5
        with:
          path: ${{ env.CACHE_PATH }}
          key: cuda-${{ runner.os }}-${{ matrix.config }}-x86-64-v3-cache

      - name: Prepare ccache
        run: |
          ccache --max-size=1.0G
          ccache -V && ccache --show-config
          ccache --show-stats && ccache --zero-stats

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DIPC_TOOLKIT_WITH_CUDA=ON \
            -DSIMD_CXX_FLAGS=-march=x86-64-v3 \
            -DCMAKE_CUDA_ARCHITECTURES=75 \
            -DSCALABLE_CCD_CUDA_ARCHITECTURES=75 \
            -DIPC_TOOLKIT_BUILD_TESTS=ON \
            -DIPC_TOOLKIT_BUILD_PYTHON=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: |
          cmake --build build -j ${{ steps.cpu-cores.outputs.count }}
          ccache --show-stats
