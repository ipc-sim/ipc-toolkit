name: Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - docs

jobs:
  Docs:
    runs-on: ubuntu-latest
    # The deploy step pushes the built site to the gh-pages branch, which needs
    # write access. We scope it to this job so the repo default can stay
    # read-only.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Requirements
        run: |
          sudo apt-get update
          sudo apt-get install doxygen python3-sphinx graphviz ccache
          echo 'CACHE_PATH=~/.cache/ccache' >> "$GITHUB_ENV"
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Cache Build
        id: cache-build
        uses: actions/cache@v5
        with:
          path: ${{ env.CACHE_PATH }}
          # A new name on purpose: entries are immutable, and the old docs-cache
          # holds -march=native objects.
          key: docs-ccache

      - name: Prepare Ccache
        run: |
          ccache --max-size=1.0G
          ccache -V && ccache --show-config
          ccache --show-stats && ccache --zero-stats

      - name: Copy release docs
        run: |
          git fetch --all --tags

          # Checkout the versioned docs from the gh-pages branch
          git checkout origin/gh-pages -- 'v*'

          # Move the versioned docs to the build directory
          mkdir -p docs/build/html
          mv v* docs/build/html/

          # Copy the custom.css to each version's build
          for version in $(git tag -l); do
              if [ -e docs/build/html/$version/_static/css/ ]; then
                  cp docs/source/_static/css/custom.css docs/build/html/$version/_static/css/
              fi
          done

          # Copy versions.json to the root of the build
          cp docs/source/_static/versions.json docs/build/html/

      - name: Build new release docs
        run: |
          HEAD=$(git rev-parse HEAD)
          git fetch --all --tags
          cd docs
          for version in $(git tag -l); do
              if [ -d build/html/$version ]; then
                  echo "Skipping $version (already exists)"
                  continue
              fi

              echo "Processing $version:"
              git checkout $version

              # Fix links
              grep -rli 'url = {https://ipc-sim.github.io/ipc-toolkit/}' ../* | xargs -i@ sed -i 's/ipc-sim.github.io\/ipc-toolkit\//github.com\/ipc-sim\/ipc-toolkit/g' @
              grep -rli 'ipc-sim.github.io/ipc-toolkit' ../* | xargs -i@ sed -i 's/ipc-sim.github.io\/ipc-toolkit/ipctk.xyz/g' @

              pip install --force-reinstall -v "ipctk==$version"
              sphinx-build source build/html/$version \
                -D html_theme_options.version_dropdown=true \
                -D html_theme_options.version_json=https://ipctk.xyz/versions.json

              # Discard changes
              git reset --hard
          done
          pip uninstall -y ipctk
          git checkout $HEAD
          # Copy the custom.css to each version's build
          for version in $(git tag -l); do
              if [ ! -f build/html/$version/_static/css/custom.css ]; then
                  cp source/_static/css/custom.css build/html/$version/_static/css/
              fi
          done
          cd ..

      # We build ipctk for x86-64-v3 instead of -march=native. ccache hashes the
      # literal flag string, not what -march=native expands to, so a cached
      # object could be restored onto a runner that lacks some of its
      # instructions, which crashed `import ipctk` with SIGILL when Sphinx
      # started. An explicit baseline makes the flag string describe the
      # generated code, so one cache works on every runner CPU. Tight-Inclusion
      # still adds -march=native for its own objects, but it also passes
      # -mno-avx512f, which caps them at AVX2.
      - name: Check x86-64-v3 support
        run: |
          for f in avx2 bmi1 bmi2 f16c fma abm movbe xsave; do
            grep -qw "$f" /proc/cpuinfo || { echo "::error::Runner CPU lacks $f, which x86-64-v3 requires"; exit 1; }
          done
          echo "CPU: $(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2-)"

      - name: Build ipctk
        env:
          CMAKE_ARGS: -DSIMD_CXX_FLAGS=-march=x86-64-v3
        run: |
          pip install --verbose .
          ccache --show-stats

      - name: Build docs
        run: |
          cd docs
          make html
          cd build/html
          touch .nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: docs/build/html # The folder the action should deploy.
