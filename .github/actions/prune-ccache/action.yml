name: Prune ccache
description: >
  Delete the older caches that share a key prefix on the current ref, keeping
  only the newest.

# Every run saves its ccache under a new key (the prefix plus the run ID),
# because cache entries are immutable. Restores only ever read the newest one,
# so the older copies just take up space until GitHub evicts them. Each push to
# main saves about 3 GB across all workflows, so without pruning a few pushes
# are enough to exceed the repository's 10 GB cache limit.
#
# We keep the newest cache by creation time instead of the one this run just
# saved. If two runs on the same ref finish at the same time, both then keep the
# same, newest entry instead of deleting each other's.
#
# The calling job needs `permissions: actions: write`. Pruning is best effort:
# a failed delete, or a read-only token on a pull request from a fork, only
# leaves an extra cache behind until GitHub evicts it.

inputs:
  prefix:
    description: The cache key prefix, the same string the restore step passes as restore-keys.
    required: true

runs:
  using: composite
  steps:
    - name: Delete older caches
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PREFIX: ${{ inputs.prefix }}
      run: |
        gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
          --key "$PREFIX" --limit 100 --json id,key,createdAt \
          --jq 'sort_by(.createdAt) | .[:-1][] | "\(.id) \(.key)"' |
        while read -r id key; do
          echo "Deleting $key"
          gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
        done
